# GitHub Actions: сначала проверки (линтер + тесты без Docker), затем деплой на сервер.
#
# Необходимые секреты для деплоя (Settings → Secrets and variables → Actions):
# - SERVER_HOST: IP-адрес или домен сервера
# - SERVER_USER: имя пользователя SSH (например, deploy)
# - SSH_PRIVATE_KEY: приватный SSH ключ (содержимое файла ~/.ssh/id_ed25519)
# - PROJECT_PATH: путь к проекту на сервере (например, /home/deploy/my_bot)
#
# Если секреты не заданы, job deploy будет пропущен, а проверки всё равно выполнятся.

name: Check and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, tests, secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python scripts/check_secrets.py

  deploy:
    name: Deploy Bot
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_SECRETS: ${{ secrets.SERVER_HOST != '' }}
    steps:
      - name: Deploy via SSH
        if: env.HAS_DEPLOY_SECRETS == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            echo "=== Начало деплоя ==="
            cd ${{ secrets.PROJECT_PATH }}

            echo "=== Git pull ==="
            git pull origin main

            echo "=== Запуск деплоя ==="
            make ci-deploy

            echo "=== Проверка здоровья сервисов ==="
            make ci-health

            echo "=== Деплой завершен успешно ==="
      - name: Skip
        if: env.HAS_DEPLOY_SECRETS != 'true'
        run: echo "Секреты деплоя не заданы — пропускаю"
